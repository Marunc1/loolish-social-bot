name = "loolish-social-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Cron:
#  - "7 * * * *"  = rulare completa (Instagram via browser + TikTok RSS)
#  - "*/15 * * * *" = doar TikTok prin RSS (fara browser, recover rapid daca RSSHub pica)
# Gratuit: Browser Run free = 10 min/zi browser time (doar cronul orar consuma browser)
[triggers]
crons = ["7 * * * *", "*/15 * * * *"]

[[kv_namespaces]]
binding = "SOCIAL_KV"
id = "cab485140c694a4ca78645a9eff24a9c"

[browser]
binding = "BROWSER"
